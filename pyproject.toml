[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-uav-track"
version = "0.1.0"
description = "Safety-gated Jev selection for active UAV target tracking"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "lian-wsy" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["numpy>=1.24", "h5py>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

